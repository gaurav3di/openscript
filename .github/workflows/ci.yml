name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  independence:
    name: independence check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: No outside product or company is named
        run: node scripts/check-names.mjs

  build:
    name: build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install
        run: npm ci || npm install
      - name: Test
        run: npm test --if-present
