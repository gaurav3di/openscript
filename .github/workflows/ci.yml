name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  independence:
    name: independence check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: No outside product or company is named
        run: node scripts/check-names.mjs

  examples:
    name: examples compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: No documented example shadows a built-in name
        run: node scripts/check-examples.mjs

  error-codes:
    name: error code check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Every documented error code is in the catalogue
        run: node scripts/check-error-codes.mjs

  layering:
    name: layering check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Each piece can still be taken without the others
        run: node scripts/check-layering.mjs

  duplication:
    name: duplication check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: No value set is written out in two files
        run: node scripts/check-duplication.mjs

  limits:
    name: limits check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Every budget the specification states is the number the source implements
        run: node scripts/check-limits.mjs

  modularity:
    name: modularity check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Small modules, and no reaching inside one from outside
        run: node scripts/check-modularity.mjs

  number-writer:
    name: number writer check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # Asks the type checker for the type of every operand under src, so it
      # needs the compiler installed and the catalogue modules generated, which
      # a fresh checkout does not have. Nothing is built.
      - name: Install
        run: npm ci || npm install
      - name: Generate
        run: npm run generate
      - name: A number becomes text in one place
        run: node scripts/check-number-writer.mjs

  library-vectors:
    name: library vectors check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # Regenerates the vectors through the built engine and the built tests'
      # fixture and compares the bytes, so both outputs are built first.
      - name: Install
        run: npm ci || npm install
      - name: Build
        run: npm run build
      - name: Build the tests
        run: npm run build:test
      - name: The library vectors are what this engine still produces
        run: node scripts/check-library-vectors.mjs

  format-tables:
    name: format tables check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install
        run: npm ci || npm install
      - name: Build
        run: npm run build
      - name: The instruction and tag tables on the page are the compiler's
        run: node scripts/check-format-tables.mjs

  format-additive:
    name: format additive check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install
        run: npm ci || npm install
      - name: Build
        run: npm run build
      - name: Every field, opcode and tag the compiler defines has a version that defined it
        run: node scripts/check-format-additive.mjs

  format-corpus:
    name: format corpus check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install
        run: npm ci || npm install
      - name: Build
        run: npm run build
      - name: Every shipped example still compiles to the bytes the corpus holds
        run: node scripts/check-format-corpus.mjs

  colour-channels:
    name: colour channels check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install
        run: npm ci || npm install
      - name: Build
        run: npm run build
      - name: The named colours' channel values are the published ones
        run: node scripts/check-colour-channels.mjs

  python:
    name: python engine check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # The lowest version the engine supports rather than the newest, because
      # that is the one that can fail: a newer interpreter runs everything an
      # older one does, and the first host is where the floor is set. The action
      # puts both python3 and python on the path, which is what the check looks
      # for; nothing is installed with pip, because there is nothing to install.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: The second engine brings nothing with it, and its own tests pass
        run: node scripts/check-python.mjs

  no-eval:
    name: no eval check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # The only check here that needs an install and a build: it reads what a
      # consumer installs and what a runtime really executes, as well as what the
      # repository holds, and a check that only ever saw the source would be
      # checking the one copy nobody runs. Both outputs are built, because the
      # check refuses to report on an artifact that is not there.
      - name: Install
        run: npm ci || npm install
      - name: Build
        run: npm run build
      - name: Build the tests
        run: npm run build:test
      - name: Nothing builds code out of text, in the source, the build or the tooling
        run: node scripts/check-no-eval.mjs

  build:
    name: build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # The gate covers both engines, so this job needs both runtimes. A missing
      # interpreter fails npm test rather than skipping the Python half, which is
      # the whole point: a suite that quietly checks one engine is how two
      # engines drift apart.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: npm ci || npm install
      - name: Test
        run: npm test --if-present
